services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: puzzels
      POSTGRES_PASSWORD: puzzels
      POSTGRES_DB: puzzels
    volumes:
      - puzzels_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U puzzels -d puzzels']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  puzzels_pg_data:
